services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: cite
      POSTGRES_PASSWORD: cite
      POSTGRES_DB: cite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cite -d cite"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://cite:cite@db:5432/cite
      CORS_ORIGINS: '["http://localhost:3000"]'
      # Local development: debug endpoints on unless .env says otherwise.
      DEBUG_ENDPOINTS: ${DEBUG_ENDPOINTS:-true}
      # Used by `docker compose exec backend pytest`
      TEST_DATABASE_URL: postgresql+psycopg://cite:cite@db:5432/cite_test
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
      # Embedding model download (~130 MB) is cached here across restarts.
      - models:/models
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      # The browser calls the API directly, so this is the host-side URL.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  pgdata:
  models:
